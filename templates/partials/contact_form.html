<div id="pr__contact__form" class="pr__contact__form pr__dark uk-modal-full" data-uk-modal="">
  <div class="uk-modal-dialog" data-uk-height-viewport="">
    <div class="form-outer">
      <div class="uk-container uk-container-xsmall">
        <div class="form-inner uk-position-relative">
          <button class="uk-modal-close-full" type="button" data-uk-close="ratio: 2;"><span>Close</span></button>
          <h2 class="uk-modal-title uk-h1">Let's Talk?</h2>
          <p>Let’s make something awesome together</p>
          <form class="pr__contact pr__form" action="{% url 'website:contact' %}" method="post">
            {% csrf_token %}
            <div class="pr__form__group">
              <label for="contact-name">Your Name <span class="required">*</span></label>
              <input class="pr-input" id="contact-name" name="name" type="text" maxlength="100" required />
            </div>
            <div class="pr__form__group">
              <label for="contact-email">Your E-Mail <span class="required">*</span></label>
              <input class="pr-input" id="contact-email" name="email" type="email" maxlength="254" required />
            </div>
            <div class="pr__form__group">
              <label for="contact-message">Your message <span class="required">*</span></label>
              <textarea class="pr-textarea" id="contact-message" name="message" maxlength="5000" required></textarea>
            </div>
            {# Honeypot: leave empty. Hidden from people, often filled in by bots. #}
            <div style="position: absolute; left: -10000px;" aria-hidden="true">
              <label for="contact-website">Website</label>
              <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off" />
            </div>
            <div class="pr__contact__status uk-margin-medium-top" role="status" aria-live="polite"></div>
            <p class="pr__form__group uk-margin-large">
              <button class="uk-button uk-button-large uk-button-primary" type="submit">Submit</button>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div><!-- Contact Form Popup End -->
